name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p dist
          cp moliveira-seguranca.html dist/index.html
          cp -r Icons dist/Icons
          touch dist/.nojekyll
          echo "moliveiraseguranca.com.br" > dist/CNAME
          sed -i "s|window.MOLIVEIRA_CONFIG={API_URL:''}|window.MOLIVEIRA_CONFIG={API_URL:'https://moliveira-admin.onrender.com'}|g" dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
